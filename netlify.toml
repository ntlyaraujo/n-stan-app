# Netlify build settings (#27).
#
# The catch-all rewrite is deliberately NOT here — it lives in `public/_redirects`
# so that it ships inside the build and works unchanged on Cloudflare Pages too.
# Netlify would give rules in this file precedence over that file, so adding them
# in both places would only make it unclear which one is in force.
#
# What is here is what `_redirects` cannot express: the build, and the caching
# rules that a self-updating PWA depends on.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker decides when the app updates, so it must never be served
# from a cache. A stale sw.js pins the app to an old build indefinitely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed filenames, so these can be cached for as long as the browser likes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
